<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background Container -->
  <defs>
    <!-- Shadow effect for the outer ring -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <!-- Inner subtle shadow for water drop depth -->
    <filter id="inner-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feComponentTransfer in="SourceAlpha">
        <feFuncA type="linear" slope="0.7"/>
      </feComponentTransfer>
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feOffset dx="0" dy="4"/>
      <feComposite operator="out" in2="SourceAlpha" result="inverse"/>
      <feFlood flood-color="#0b2545" flood-opacity="0.15" result="color"/>
      <feComposite operator="in" in2="inverse" result="shadow"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Group with outer drop-shadow -->
  <g filter="url(#drop-shadow)">
    <!-- Main Dark Blue Circle with Thick White Border -->
    <circle 
      cx="250" 
      cy="250" 
      r="200" 
      fill="#0B2545" 
      stroke="#FFFFFF" 
      stroke-width="24" 
    />

    <!-- Inscribed White Water Drop -->
    <!-- 
      Path Breakdown:
      - Starts at top point: (250, 115)
      - Curves down & outward right to bottom lobe: C 250,115 345,260 345,315
      - Arc around the bottom: A 95 95 0 0 1 155 315
      - Curves back up to top point: C 155,260 250,115 250,115
    -->
    <path 
      d="M 250 115 
         C 250 115, 345 260, 345 315 
         A 95 95 0 0 1 155 315 
         C 155 260, 250 115, 250 115 Z" 
      fill="#FFFFFF"
    />

    <!-- Subtle Curved Highlight on Water Drop for Polish -->
    <path 
      d="M 210 210 
         C 200 235, 195 265, 198 295
         A 8 8 0 0 1 182 297
         C 179 262, 185 228, 197 200
         A 8 8 0 0 1 210 210 Z" 
      fill="#0B2545" 
      opacity="0.12" 
    />
  </g>
</svg>
